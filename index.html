                                                <div>
                                                    <h4 className="font-bold text-gray-900 mb-2">{tender.title}</h4>
                                                    <div className="text-sm text-gray-600">{tender.org} • {tender.value}</div>
                                                </div>
                                                <span className={`status-pill status-${tender.status}`}>
                                                    {tender.status.charAt(0).toUpperCase() + tender.status.slice(1)}
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <div className="text-sm text-gray-600">
                                                    Deadline: <span className="font-semibold">{new Date(tender.deadline).toLocaleDateString('en-IN')}</span>
                                                </div>
                                                {tender.status !== 'closed' && (
                                                    <div className="flex items-center space-x-4">
                                                        <div className="w-32">
                                                            <div className="text-xs text-gray-600 mb-1">Win Probability</div>
                                                            <div className="win-prob-bar">
                                                                <div className="win-prob-fill bg-green-500" style={{ width: `${tender.winProb}%` }}></div>
                                                            </div>
                                                            <div className="text-xs text-right mt-1 font-semibold">{tender.winProb}%</div>
                                                        </div>
                                                        <button className="gradient-bg text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition">
                                                            Analyze
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function LandingPage() {
            return (
                <div>
                    <Navigation onViewChange={onViewChange} currentView="landing" />
                    <HeroSection />
                    <FeaturesSection />
                    <DashboardPreview />
                    <PricingSection />
                    <Footer />
                </div>
            );
        }

        // Main App
        function App() {
            const [currentView, setCurrentView] = useState('landing');

            global.onViewChange = (view) => {
                setCurrentView(view);
                window.scrollTo(0, 0);
            };

            if (currentView === 'dashboard') {
                return <FullDashboard />;
            }

            return <LandingPage />;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
